<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Age of Popozitos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Lilita+One&family=Fredoka:wght@500;700&family=MedievalSharp&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="campaign.css?v=20261101-equipe-continua">
  <link rel="stylesheet" href="battle-hud.css">
  <link rel="stylesheet" href="tutorial.css">
  <link rel="stylesheet" href="loading.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body class="no-battle">
  <div id="bars"></div>
  <div id="hud" role="toolbar" aria-label="Batalha">
    <div class="hud-left">
      <span class="hud-diff" id="level" role="img" aria-label="Dificuldade" data-tip="Dificuldade"></span>
      <span class="chip" id="wave" data-tip="Fase atual / última fase">1/1</span>
      <span class="chip" id="left" data-tip="Inimigos restantes">0</span>
      <span class="chip militia-chip" id="militia" hidden data-tip="Milícia: aldeões armados lutando com o grupo">0</span>
      <span class="relic-tray hidden" id="relics" aria-label="Relíquias ativas"></span>
    </div>
    <span class="chip hidden" id="goal" data-tip="Objetivo da missão"></span>
    <div class="hud-right">
      <button id="directControlToggle" class="hud-icon direct-control-toggle" type="button" aria-pressed="false" aria-label="Assumir o controle do herói (C)" data-tip="Controle direto · C">🎮</button>
      <button id="pause" class="hud-icon" type="button" aria-pressed="false" aria-label="Pausar (P ou Espaço)" data-tip="Pausar · P ou Espaço">⏸&#xFE0E;</button>
      <button id="speed" class="hud-icon" type="button" aria-label="Velocidade 1x" data-tip="Velocidade do jogo · clique para alternar 1x, 2x, 3x">⏩&#xFE0E;<small>1x</small></button>
      <button id="mute" class="hud-icon" type="button" aria-label="Desligar o som" data-tip="Som · liga e desliga"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path class="spk" d="M3 9h4l5-4v14l-5-4H3z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off" d="M16 9l6 6M22 9l-6 6"/></svg></button>
      <button id="hudMenu" class="hud-icon" type="button" aria-expanded="false" aria-controls="hudOptions" aria-label="Opções" data-tip="Opções">⚙&#xFE0E;</button>
      <div id="hudOptions" role="menu" aria-label="Opções">
        <button id="autoEvolve" type="button" role="menuitemcheckbox" aria-pressed="false">Evolução: você escolhe</button>
        <button id="quality" type="button" role="menuitemcheckbox" aria-pressed="false">Gráficos: alta</button>
        <button id="restart" type="button" role="menuitem" class="danger">↺ Reiniciar</button>
      </div>
    </div>
  </div>
  <div id="soundHint" role="status" hidden>Som desligado · ligue no alto-falante ↗</div>
  <aside id="fpsHint" class="fps-hint" role="status" aria-live="polite" hidden>
    <div class="fps-hint-copy">
      <strong>FPS baixo detectado</strong>
      <p>No Chrome, abra <code>chrome://settings/system</code>, ative “Usar aceleração gráfica quando disponível” e reinicie o navegador.</p>
    </div>
    <div class="fps-hint-actions">
      <button id="fpsHintLow" type="button">Gráficos baixos</button>
      <button id="fpsHintClose" type="button">Agora não</button>
    </div>
  </aside>
  <div id="skills" role="group" aria-label="Habilidades dos heróis"></div>
  <div id="directControlHint" class="is-hidden" role="status" aria-label="Controle direto" tabindex="0"
    data-tip="C devolve à IA · setas ou botão direito movem · botão esquerdo ataca · Q/W/E/R habilidades (Auto desligado) · mouse mira">
    <span aria-hidden="true">🎮&#xFE0E;</span><span class="direct-control-title" id="directControlHero">Herói</span><kbd>C</kbd>
  </div>
  <div id="banner" aria-live="polite"></div>
  <div id="bossBar" hidden></div>
  <div id="pick" class="hidden">
    <span id="pickTitle"></span>
    <span id="pickSub"></span>
    <div id="pickList"></div>
    <span id="pickHint"></span>
  </div>
  <div id="campaign" class="hidden"></div>
  <div id="camp" class="hidden" role="region" aria-label="Acampamento"></div>
  <aside id="heroPanel" class="hidden"></aside>
  <div id="pauseOverlay" class="modal" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
    <div class="modal-box"><b id="pauseTitle">⏸&#xFE0E; Pausa</b><button id="resume" type="button" aria-label="Continuar (P ou Espaço)">▶&#xFE0E; Continuar</button></div>
  </div>
  <div id="restartConfirm" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="restartTitle" aria-describedby="restartText" hidden>
    <div class="modal-box"><b id="restartTitle">Reiniciar?</b><span id="restartText">A partida será perdida.</span>
      <div class="modal-actions"><button id="restartNo" type="button">Voltar</button><button id="restartYes" type="button" class="danger">↺ Reiniciar</button></div></div>
  </div>
  <div id="overlay" class="hidden"><div class="overlay-card"><b id="overlayTitle"></b><span id="overlayText"></span><div id="overlayStars"></div><div id="overlayStats"></div>
    <div id="overlayActions"><span id="overlayNext"></span><button id="overlayBtn" hidden>Jogar de novo</button></div></div></div>
  <div id="loading" role="status" aria-label="Carregando">
    <div class="ld-logo"></div>
    <div class="ld-track"><div class="ld-fill"></div>
      <div class="ld-runner" aria-hidden="true"><i class="ld-dust"></i><svg viewBox="0 0 44 48">
        <rect class="ld-leg" x="14" y="30" width="5" height="14" rx="2.5" fill="#efe7d0" stroke="#0d1426" stroke-width="2"/>
        <rect class="ld-leg b" x="25" y="30" width="5" height="14" rx="2.5" fill="#efe7d0" stroke="#0d1426" stroke-width="2"/>
        <path d="M22 3C11 3 5 10 5 18c0 6 3 9 6 11v5h22v-5c3-2 6-5 6-11 0-8-6-15-17-15Z" fill="#fffaf0" stroke="#0d1426" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="15.5" cy="18" rx="4.5" ry="5" fill="#0d1426"/><ellipse cx="28.5" cy="18" rx="4.5" ry="5" fill="#0d1426"/>
        <circle cx="16.5" cy="16.5" r="1.4" fill="#fff"/><circle cx="29.5" cy="16.5" r="1.4" fill="#fff"/>
        <path d="M20 25l2-3 2 3Z" fill="#0d1426"/><path d="M15 30v4M20 30v4M25 30v4M30 30v4" stroke="#0d1426" stroke-width="2"/>
        <path d="M12 6l-3-6 7 3 6-4 6 4 7-3-3 6" fill="#ffd23f" stroke="#0d1426" stroke-width="2" stroke-linejoin="round"/>
      </svg></div></div>
    <p class="ld-tip"></p>
  </div>
  <script type="module" src="main.js?v=20261030-wheel-zoom"></script>
</body>
</html>
