<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cavaleiros vs Esqueletos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Lilita+One&family=Fredoka:wght@500;700&family=MedievalSharp&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2228; font-family: 'Fredoka', system-ui, sans-serif; color: #f1ecdc; }
    canvas { display: block; }
    /* ---------- interface fofa e medieval: pergaminho, madeira e ouro ---------- */
    :root { --wood: #8a5a2e; --wood-dark: #4a2c1a; --gold: #f2c94c; --parch: #fff3d6; --parch-dark: #f0d9a8; }
    #hud { position: absolute; top: 12px; left: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px 6px 12px; font-size: 16px; font-weight: 700; color: var(--wood-dark);
      background: linear-gradient(var(--parch), var(--parch-dark)); border: 3px solid var(--wood); border-radius: 12px;
      box-shadow: inset 0 0 0 2px #fffaf0, 0 4px 0 var(--wood-dark), 0 6px 10px rgba(0, 0, 0, .25); }
    .chip::after { content: ''; position: absolute; inset: 3px; pointer-events: none; border-radius: 8px;
      background: radial-gradient(circle at 4px 4px, var(--gold) 0 2.5px, transparent 3px), radial-gradient(circle at calc(100% - 4px) 4px, var(--gold) 0 2.5px, transparent 3px),
        radial-gradient(circle at 4px calc(100% - 4px), var(--gold) 0 2.5px, transparent 3px), radial-gradient(circle at calc(100% - 4px) calc(100% - 4px), var(--gold) 0 2.5px, transparent 3px); }
    #wave::before, #left::before, #kills::before, #party::before { font-size: 17px; color: #b3261e; }
    #wave::before { content: '\2691\FE0E'; } #left::before { content: '\2620\FE0E'; color: #5a4a6a; }
    #kills::before { content: '\2694\FE0E'; color: #6b3f17; } #party::before { content: '\265B\FE0E'; color: #d19a1c; }
    button { position: relative; font-family: inherit; color: var(--parch); padding: 7px 18px 8px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
      background: linear-gradient(#b07a43, var(--wood) 55%, #73461f); border: 3px solid var(--gold); border-radius: 14px;
      text-shadow: 0 2px 0 var(--wood-dark); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25), 0 4px 0 var(--wood-dark), 0 6px 10px rgba(0, 0, 0, .3); transition: transform .1s, filter .15s; }
    button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    button:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .2), 0 1px 0 var(--wood-dark); }
    /* números de dano e corações */
    .pop { position: absolute; transform: translate(-50%, -50%); font: 700 24px 'Fredoka', sans-serif; color: #fff; -webkit-text-stroke: 5px #d1342b; paint-order: stroke fill; animation: popUp .9s ease-out forwards; }
    .pop.hurt { color: #ffe1e1; -webkit-text-stroke-color: #8a1c1c; font-size: 20px; }
    .pop.heal { color: #ff6fa8; -webkit-text-stroke-color: #fff; font-size: 34px; }
    @keyframes popUp { 0% { transform: translate(-50%, -50%) scale(.3); } 20% { transform: translate(-50%, -60%) scale(1.3); }
      40% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(-50%, -180%) scale(.9); opacity: 0; } }
    /* ---------- escolha de herói: arcade medieval ---------- */
    /* fofo com toque medieval: céu pastel, cartões redondinhos, cor própria de cada herói (--c) */
    #pick { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; overflow: hidden;
      background: radial-gradient(ellipse at center, rgba(20, 14, 30, .35), rgba(20, 14, 30, .7)); font-family: 'Fredoka', sans-serif; }
    #pick.hidden { display: none; }
    #pick::before, #pick::after { content: ''; position: fixed; inset: -50%; pointer-events: none; opacity: .35;
      background-image: radial-gradient(circle, #fff 0 3px, transparent 4px), radial-gradient(circle, #fff7b8 0 2px, transparent 3px);
      background-size: 90px 90px, 130px 130px; background-position: 0 0, 40px 60px; animation: drift 18s linear infinite; }
    #pick::after { animation-duration: 28s; opacity: .25; background-size: 150px 150px, 70px 70px; }
    #pickTitle { position: relative; padding: 0 44px; font-size: 46px; font-weight: 700; color: #fff; -webkit-text-stroke: 8px #4a2c1a; paint-order: stroke fill;
      text-shadow: 0 6px 0 rgba(0, 0, 0, .3); animation: drop .6s cubic-bezier(.2, 1.8, .4, 1); }
    #pickTitle::before, #pickTitle::after { content: '♛'; position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; color: #ffe066; -webkit-text-stroke: 5px #4a2c1a; }
    #pickTitle::before { left: 0; } #pickTitle::after { right: 0; }
    #pickSub { margin-top: -10px; font-size: 19px; font-weight: 500; color: #fff3d6; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
    #pickList { position: relative; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
    /* Pergaminho, madeira e ferragens; a entrada só roda ao abrir a tela. */
    #pickList { perspective: 1100px; padding: 16px 6px; }
    .card { position: relative; isolation: isolate; width: 196px; padding: 17px 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-family: inherit; color: #593b29; border: 9px solid transparent; border-radius: 14px;
      background: radial-gradient(ellipse at 40% 20%, #fff5d9, #e9cf98) padding-box,
        repeating-linear-gradient(7deg, #69402a 0 4px, #865638 5px 9px, #75492f 10px 13px) border-box;
      box-shadow: 0 7px 0 #442b21, 0 14px 26px #170e1f80, inset 0 0 0 2px #ba854d;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .35s ease, box-shadow .35s ease, opacity .25s, filter .35s;
      animation: rise .55s backwards ease; animation-delay: var(--d); }
    .card.arrived { animation: none; }
    .card::before { content: ''; position: absolute; z-index: 2; inset: -10px; border-radius: 12px; pointer-events: none;
      background: radial-gradient(circle at 9px 9px, #775226 0 2px, #fff1a3 3px 4px, transparent 5px) top left / 22px 22px no-repeat,
        radial-gradient(circle at 13px 9px, #775226 0 2px, #fff1a3 3px 4px, transparent 5px) top right / 22px 22px no-repeat,
        radial-gradient(circle at 9px 13px, #775226 0 2px, #fff1a3 3px 4px, transparent 5px) bottom left / 22px 22px no-repeat,
        radial-gradient(circle at 13px 13px, #775226 0 2px, #fff1a3 3px 4px, transparent 5px) bottom right / 22px 22px no-repeat,
        linear-gradient(#efcd76, #b58138) top left / 24px 21px no-repeat,
        linear-gradient(#efcd76, #b58138) top right / 24px 21px no-repeat,
        linear-gradient(#efcd76, #b58138) bottom left / 24px 21px no-repeat,
        linear-gradient(#efcd76, #b58138) bottom right / 24px 21px no-repeat; }
    .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 5px; opacity: 0;
      background: linear-gradient(110deg, transparent 25%, #fff9 48%, transparent 65%) -300px 0 / 300px 100% no-repeat;
      transition: background-position .7s ease, opacity .4s; }
    .card:hover::after, .card:focus-within::after { background-position: 280px 0; opacity: 1; }
    .card:hover, .card.sel { transform: perspective(900px) translateY(-10px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      box-shadow: 0 8px 0 #442b21, 0 0 0 3px var(--c), 0 0 28px var(--c), inset 0 0 0 2px #ba854d; }
    #pickList:has(.card:not(.owned):hover) .card:not(:hover) { filter: brightness(.78); }
    .card .num { position: absolute; z-index: 3; top: -21px; left: -21px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 20px; color: #fff0bd;
      background: radial-gradient(circle at 35% 30%, #d26569, #9e3546); border: 3px double #f29c89; border-radius: 50%; box-shadow: 0 3px 0 #722b36; }
    .card .portrait { width: 160px; height: 160px; padding: 5px; box-sizing: border-box; overflow: hidden; border: 0; border-radius: 0;
      clip-path: polygon(0 0, 100% 0, 96% 62%, 82% 82%, 50% 100%, 18% 82%, 4% 62%); background: var(--cd); }
    .card .portrait img { width: 100%; height: 100%; display: block; object-fit: contain;
      clip-path: polygon(0 0, 100% 0, 96% 62%, 82% 82%, 50% 100%, 18% 82%, 4% 62%);
      background: radial-gradient(circle at 50% 35%, #fff9e9, var(--c)); transition: transform .4s ease; }
    .card:hover .portrait img, .card.sel .portrait img { transform: translateY(-4px) scale(1.08); }
    .card .ribbon { position: relative; z-index: 1; margin: -16px -8px 0; padding: 7px 22px 9px; max-width: 182px;
      font: 700 22px 'MedievalSharp', serif; text-align: center; color: #fffdf4; background: var(--cd); text-shadow: 0 1px 2px #38271a;
      clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 50% 94%, 0 100%, 5% 50%); }
    .card p { margin: 0; min-height: 36px; font-size: 14px; line-height: 1.25; text-align: center; }
    .stats { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 13px; font-weight: 500; }
    .pips { display: flex; gap: 4px; }
    .pips i { width: 11px; height: 11px; background: #cabb9a; clip-path: polygon(50% 0, 100% 45%, 50% 100%, 0 45%); }
    .pips i.on { background: var(--cd); box-shadow: inset 2px 2px 0 #ffffff80; }
    .pips.hearts i { width: auto; height: auto; background: none; box-shadow: none; clip-path: none; font-style: normal; font-size: 14px; line-height: 11px; color: #cabb9a; }
    .pips.hearts i::before { content: '♥'; }
    .pips.hearts i.on { color: #de5575; }
    .upgrade { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; min-height: 126px; padding: 16px 10px; white-space: normal;
      background: var(--cd); border-radius: 8px; box-shadow: 0 4px 0 #63432d; font-size: 15px; text-shadow: 0 1px 2px #33251b; }
    .upgrade b { font-size: 22px; }
    .upgrade:hover { background: var(--cd); filter: brightness(1.1); }
    .pop.block { color: #fff5b5; -webkit-text-stroke-color: #6d7f9f; font-size: 22px; }
    .card.chosen, .card.arrived.chosen { animation: chosen .5s forwards; }
    .card.gone { opacity: 0; transform: scale(.8) translateY(30px); }
    .burst { position: absolute; left: 50%; top: 40%; font-size: 26px; color: #ff5d8f; pointer-events: none; animation: burst .8s ease-out forwards; }
    #pickHint { position: relative; padding: 6px 18px; font-size: 15px; font-weight: 700; color: var(--wood-dark); background: linear-gradient(var(--parch), var(--parch-dark));
      border: 3px solid var(--wood); border-radius: 12px; box-shadow: 0 3px 0 var(--wood-dark); animation: breathe 1.6s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(90px) scale(.6); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-70px) scale(1.4); } }
    @keyframes wobble { 0%, 100% { rotate: -1deg; } 50% { rotate: 1deg; } }
    @keyframes bob { 50% { transform: translateY(-6px) scale(1.05); } }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes drift { to { transform: translate(90px, -180px); } }
    @keyframes chosen { 40% { transform: translateY(-30px) scale(1.18) rotate(3deg); } 100% { transform: translateY(-20px) scale(1.1); } }
    @keyframes burst { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); opacity: 0; } }
    .hp.boss { width: 90px; height: 8px; margin-left: -45px; }
    /* faixa de fita vermelha com pontas recortadas */
    #banner { position: absolute; top: 15%; left: 50%; translate: -50% 0; width: max-content; max-width: 90vw; padding: 10px 70px 16px; text-align: center;
      font: 700 48px 'Fredoka', sans-serif; color: #fff; -webkit-text-stroke: 8px #6b1410; paint-order: stroke fill;
      background: linear-gradient(#e0473b, #b3261e 60%, #8a1c16); clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%);
      filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .25)); pointer-events: none; opacity: 0; transition: opacity .4s; }
    #banner.show { animation: bannerPop .5s cubic-bezier(.2, 1.8, .4, 1); }
    @keyframes bannerPop { from { transform: scale(.3) rotate(-6deg); } }
    /* carregando / derrota / vitória: pergaminho enrolado com bastões de madeira */
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(20, 14, 30, .45), rgba(20, 14, 30, .8)); font-size: 22px; }
    #overlayText { position: relative; max-width: 460px; padding: 26px 40px; text-align: center; font: 700 24px 'Fredoka', sans-serif; line-height: 1.35; color: var(--wood-dark);
      background: linear-gradient(90deg, #ead09a, var(--parch) 12%, var(--parch) 88%, #ead09a); border-radius: 6px; box-shadow: 0 10px 24px rgba(0, 0, 0, .4); }
    #overlayText::before, #overlayText::after { content: ''; position: absolute; left: -14px; right: -14px; height: 16px; border-radius: 8px;
      background: linear-gradient(#b07a43, var(--wood) 50%, #5a3416); border: 2px solid var(--gold); }
    #overlayText::before { top: -10px; } #overlayText::after { bottom: -10px; }
    #overlay button { font-size: 20px; padding: 10px 26px 12px; }
    /* resumo da partida (tabela no fim do jogo) */
    #overlayStats:empty { display: none; }
    #overlayStats table { border-collapse: separate; border-spacing: 0; font: 600 15px 'Fredoka', sans-serif; color: var(--wood-dark);
      background: linear-gradient(var(--parch), var(--parch-dark)); border: 3px solid var(--wood); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 var(--wood-dark); }
    #overlayStats th { padding: 7px 12px; color: var(--parch); background: var(--wood); text-shadow: 0 1px 0 var(--wood-dark); }
    #overlayStats td { padding: 5px 12px; text-align: center; border-top: 1px dashed #d8b980; }
    #overlayStats td:first-child { display: flex; align-items: center; gap: 8px; text-align: left; white-space: nowrap; }
    #overlayStats img { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid var(--wood); }
    #overlayStats td.top { color: #b3261e; font-weight: 700; }
    #overlayStats .mvp { padding: 1px 7px; font-size: 12px; color: #6b4a00; background: var(--gold); border-radius: 99px; }
    /* cartão do herói (abre ao clicar nele) */
    #heroPanel { position: absolute; top: 64px; right: 14px; width: 270px; max-height: calc(100vh - 90px); overflow-y: auto; padding: 16px 16px 12px; box-sizing: border-box;
      font-size: 14px; color: var(--wood-dark); background: linear-gradient(var(--parch), var(--parch-dark)); border: 4px solid var(--wood); border-radius: 18px;
      box-shadow: inset 0 0 0 3px #fffaf0, inset 0 0 0 5px var(--cd, var(--gold)), 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0, 0, 0, .35); animation: panelIn .3s cubic-bezier(.2, 1.6, .4, 1); }
    #heroPanel.hidden { display: none; }
    #heroPanel .close { position: absolute; top: 8px; right: 8px; padding: 2px 9px 4px; font-size: 14px; }
    #heroPanel .hp-top { display: flex; gap: 12px; align-items: center; }
    #heroPanel .portrait { flex: none; width: 78px; height: 78px; border-radius: 50%; overflow: hidden; border: 4px solid #fff; box-shadow: 0 0 0 3px var(--cd);
      background: radial-gradient(circle at 50% 40%, #fff, var(--c) 75%); }
    #heroPanel .portrait img { width: 100%; height: 100%; }
    #heroPanel .ribbon { display: inline-block; padding: 2px 14px 4px; font: 700 18px 'Fredoka', sans-serif; color: #fff; background: var(--cd); border-radius: 999px; }
    #heroPanel .lvl { margin: 4px 0 3px; font-weight: 700; }
    #heroPanel .xp { height: 8px; background: #e8d4a8; border: 2px solid var(--wood); border-radius: 99px; overflow: hidden; }
    #heroPanel .xp i { display: block; height: 100%; background: linear-gradient(90deg, #ffe066, #f2a93b); }
    #heroPanel .xp-txt { margin-top: 2px; font-size: 12px; color: #8a6a4a; }
    #heroPanel .ability { margin-top: 10px; padding: 7px 10px; font-size: 13px; background: #fffaf0; border: 2px dashed var(--c); border-radius: 10px; }
    #heroPanel .ability b { display: block; color: var(--cd); }
    #heroPanel h4 { margin: 12px 0 4px; font: 700 15px 'MedievalSharp', serif; color: #8a3a1e; border-bottom: 2px solid #e2c48a; }
    #heroPanel dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 0; }
    #heroPanel dt { color: #7a5a3a; } #heroPanel dd { margin: 0; font-weight: 700; text-align: right; }
    @keyframes panelIn { from { opacity: 0; transform: translateX(40px) scale(.9); } }
    #overlay.hidden { display: none; }
    #bars { position: absolute; inset: 0; pointer-events: none; }
    .hp { position: absolute; width: 40px; height: 6px; margin-left: -22px; background: rgba(60, 30, 20, .6); border: 2px solid var(--parch); border-radius: 99px; overflow: hidden;
      box-shadow: 0 0 0 1.5px var(--wood-dark); }
    .hp > i { display: block; height: 100%; background: #ff5d6c; border-radius: 99px; }
    .hp.ally > i { background: #5fd35f; }
    .hp.ally { overflow: visible; }
    .hp.ally > span { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #432d37, 1px 0 2px #432d37; }
    .pop.crit { font-size: 38px; color: #ffe066; }
    .pop.evolve { font-size: 28px; color: #fff1a1; -webkit-text-stroke-color: #9a6be0; }
    .card { box-sizing: content-box; }
    .ability { color: var(--cd); font-size: 14px; text-align: center; }
    /* escolha de herói: uma linha por classe (estandarte + 4 variantes) e painel de detalhes do cartão em foco */
    #pickList.grid { flex-wrap: wrap; align-items: center; gap: 20px; padding: 6px; }
    .pick-rows { display: grid; gap: 7px; }
    .pick-row { display: flex; align-items: center; gap: 14px; }
    .class-tag { flex: none; width: 92px; padding: 10px 4px 20px; box-sizing: border-box; text-align: center; font: 700 16px 'MedievalSharp', serif; color: var(--parch);
      text-shadow: 0 2px 0 var(--wood-dark); background: radial-gradient(circle at 50% 9px, #fff1a3 0 3px, #b58138 4px 5px, transparent 6px), linear-gradient(#b07a43, var(--wood) 55%, #73461f);
      border: 3px solid var(--gold); border-bottom: 0; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
    #pickList.grid .card { width: 114px; padding: 5px 6px 6px; gap: 2px; border-width: 6px; border-radius: 12px; cursor: pointer; }
    #pickList.grid .card::before { inset: -7px; }
    #pickList.grid .card:hover, #pickList.grid .card.sel { transform: perspective(900px) translateY(-5px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      box-shadow: 0 6px 0 #442b21, 0 0 0 3px var(--c), 0 0 18px var(--c), inset 0 0 0 2px #ba854d; }
    #pickList.grid .card .portrait { width: 78px; height: 78px; padding: 4px; }
    #pickList.grid .card .ribbon { margin: -12px -6px 0; padding: 4px 8px 6px; max-width: none; font-size: 13px; white-space: nowrap; }
    #pickList.grid .card .ability { font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
    #pickList.grid .card.owned { cursor: not-allowed; }
    #pickList.grid .card.owned:hover { transform: none; box-shadow: 0 7px 0 #442b21, 0 14px 26px #170e1f80, inset 0 0 0 2px #ba854d; }
    #pickList.grid .card.owned::after { display: none; }
    #pickList.grid .card.owned .portrait img { transform: none; }
    .card.owned .portrait, .card.owned .ribbon, .card.owned .ability { filter: grayscale(1); opacity: .5; }
    .card .seal { position: absolute; z-index: 3; top: 22px; left: 50%; translate: -50% 0; rotate: -12deg; width: 50px; height: 50px; display: grid; place-items: center;
      font-size: 11px; font-weight: 700; line-height: 1.05; text-align: center; color: #fff0bd; background: radial-gradient(circle at 35% 30%, #d26569, #9e3546);
      border: 3px double #f29c89; border-radius: 50%; box-shadow: 0 3px 0 #722b36; }
    .pick-info { position: relative; width: 236px; padding: 16px 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-size: 14px; color: var(--wood-dark); background: linear-gradient(var(--parch), var(--parch-dark)); border: 4px solid var(--wood); border-radius: 18px;
      box-shadow: inset 0 0 0 3px #fffaf0, inset 0 0 0 5px var(--cd), 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0, 0, 0, .35); }
    .pick-info .crest { width: 118px; height: 118px; padding: 5px; box-sizing: border-box; background: var(--cd); clip-path: polygon(0 0, 100% 0, 96% 62%, 82% 82%, 50% 100%, 18% 82%, 4% 62%); }
    .pick-info .crest img { width: 100%; height: 100%; display: block; object-fit: contain; background: radial-gradient(circle at 50% 35%, #fff9e9, var(--c));
      clip-path: polygon(0 0, 100% 0, 96% 62%, 82% 82%, 50% 100%, 18% 82%, 4% 62%); }
    .pick-info .ribbon { position: relative; z-index: 1; margin-top: -18px; padding: 6px 20px 8px; font: 700 20px 'MedievalSharp', serif; color: #fffdf4; background: var(--cd);
      text-shadow: 0 1px 2px #38271a; clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 50% 94%, 0 100%, 5% 50%); }
    .pick-info small { margin-top: -4px; font-size: 13px; font-weight: 600; color: #8a6a4a; }
    .pick-info .ability { width: 100%; padding: 7px 10px; box-sizing: border-box; font-size: 13px; line-height: 1.25; color: var(--wood-dark); background: #fffaf0;
      border: 2px dashed var(--c); border-radius: 10px; }
    .pick-info .ability b { display: block; margin-bottom: 2px; font-size: 15px; color: var(--cd); }
    button:focus-visible { outline: 3px solid #6b3f17; outline-offset: 4px; }
    @media (max-width: 1050px), (max-height: 760px) {

    /* ==================== visual estilo Clash: painéis azul-marinho, fonte grossa contornada, brilho ==================== */
    :root { --navy: #1f2f52; --navy-2: #2c4272; --navy-edge: #0f1a33; --sky: #4fb3ff; --sky-dark: #1d6fd6; --gold: #ffd44a; --gold-dark: #c98a12;

    html, body { font-family: 'Lilita One', 'Fredoka', system-ui, sans-serif; }
    /* texto grosso com contorno escuro, como nos jogos da Supercell */
    .chip, button, #banner, #pickTitle, .class-tag, #pickList.grid .card .ribbon, .pick-info .ribbon, #overlayText, .pop, #heroPanel .ribbon {
      font-family: 'Lilita One', sans-serif; font-weight: 400; letter-spacing: .3px; }
    .chip { color: #fff; font-size: 16px; -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; text-shadow: 0 2px 0 var(--outline);

    .chip::after { display: none; }

    button { color: #fff; font-size: 16px; -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; text-shadow: 0 2px 0 var(--outline);
      background: linear-gradient(#7cc8ff 0%, var(--sky) 45%, var(--sky-dark) 100%); border: 3px solid var(--outline); border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), inset 0 -4px 0 rgba(0, 0, 0, .25), 0 4px 0 var(--outline); }
    button:hover { filter: brightness(1.1); }
    #banner { color: #fff; font-size: 46px; -webkit-text-stroke: 7px var(--outline); padding: 10px 70px 16px;
      background: linear-gradient(#6cc0ff, #2a86e8 55%, #1a5fbf); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); filter: drop-shadow(0 5px 0 var(--outline)); }
    .pop { -webkit-text-stroke-width: 5px; }
    #overlayText { color: #fff; font-size: 26px; -webkit-text-stroke: 5px var(--outline); paint-order: stroke fill;
      background: linear-gradient(var(--navy-2), var(--navy)); border: 4px solid var(--navy-edge); border-radius: 18px;
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .15), 0 6px 0 var(--navy-edge), 0 14px 30px rgba(0, 0, 0, .5); }
    #overlayText::before, #overlayText::after { display: none; }
    .hp { border: 2px solid var(--outline); border-radius: 5px; background: #1b223a; box-shadow: 0 1px 0 var(--outline); }
    .hp > i { border-radius: 3px; background: linear-gradient(#ff7a7a, #e0303a); } .hp.ally > i { background: linear-gradient(#8ef07a, #3fb83a); }
    .hp.ally > span { font-family: 'Lilita One', sans-serif; font-size: 13px; -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; }
    /* tela de escolha: painel azul-marinho, fita azul no título, cartões com arte cheia e moldura brilhante */
    #pick { background: radial-gradient(ellipse at center, rgba(16, 26, 52, .55), rgba(8, 12, 26, .88)); }
    #pick::before, #pick::after { display: none; }
    #pickTitle { color: #fff; font-size: 38px; -webkit-text-stroke: 7px var(--outline); padding: 8px 70px 14px;
      background: linear-gradient(#6cc0ff, #2a86e8 55%, #1a5fbf); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); filter: drop-shadow(0 5px 0 var(--outline)); }
    #pickTitle::before, #pickTitle::after { display: none; }
    #pickSub { font-family: 'Lilita One', sans-serif; color: #cfe6ff; -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; }

      background: linear-gradient(#3a5a92, #233a66); border: 3px solid var(--navy-edge); border-radius: 12px; box-shadow: 0 3px 0 var(--navy-edge); }
    .pick-rows { padding: 14px 16px; gap: 10px; border: 4px solid var(--navy-edge); border-radius: 18px;
      background: linear-gradient(160deg, #34507f, #22365e 60%, #1b2b4d); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .15), 0 6px 0 var(--navy-edge), 0 16px 30px rgba(0, 0, 0, .5); }
    .class-tag { width: 88px; padding: 10px 4px 12px; font-size: 15px; color: #fff; -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; border: 3px solid var(--outline);

    /* cartão: arte ocupando o topo, moldura em gradiente da cor da variante, faixa escura embaixo */
    #pickList.grid .card { width: 112px; padding: 4px 4px 0; gap: 0; border: 3px solid var(--outline); border-radius: 12px; overflow: hidden;

    #pickList.grid .card::before { display: none; }

    #pickList.grid .card .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; clip-path: none;

    #pickList.grid .card .ribbon { position: relative; margin: -14px 0 0; padding: 0; background: none; border: 0; clip-path: none; box-shadow: none;
      font-size: 15px; color: #fff; -webkit-text-stroke: 4px var(--outline); paint-order: stroke fill; text-shadow: 0 2px 0 var(--outline); }
    #pickList.grid .card .ability { width: calc(100% + 8px); margin: 3px -4px 0; padding: 4px 2px 5px; box-sizing: border-box; text-align: center;
      font: 400 11px 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 2.5px var(--outline); paint-order: stroke fill;
      background: linear-gradient(rgba(0, 0, 0, .15), rgba(0, 0, 0, .45)); border-top: 2px solid rgba(0, 0, 0, .35); }
    #pickList.grid .card:hover, #pickList.grid .card.sel { box-shadow: 0 0 0 3px var(--gold), 0 0 20px 4px rgba(255, 212, 74, .75), inset 0 2px 0 rgba(255, 255, 255, .5), 0 4px 0 var(--outline); }
    #pickList.grid .card.owned { background: linear-gradient(#7a7f8c, #4c5160); }
    .card .seal { font-family: 'Lilita One', sans-serif; background: linear-gradient(#ff6a7a, #c22a46); border: 3px solid var(--outline); }
    .pick-info { border: 4px solid var(--navy-edge); border-radius: 18px; color: #fff; background: linear-gradient(160deg, #34507f, #1f3156);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .15), 0 6px 0 var(--navy-edge), 0 16px 30px rgba(0, 0, 0, .5); }
    .pick-info .crest { width: 120px; height: 120px; padding: 4px; border-radius: 14px; clip-path: none; background: linear-gradient(170deg, var(--c), var(--cd)); border: 3px solid var(--outline); }
    .pick-info .crest img { border-radius: 10px; clip-path: none; object-fit: cover; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 40%, #fff), var(--cd)); }
    .pick-info .ribbon { margin-top: -16px; padding: 4px 18px 7px; font-size: 20px; color: #fff; -webkit-text-stroke: 4px var(--outline); paint-order: stroke fill;
      background: linear-gradient(#6cc0ff, #1d6fd6); border: 3px solid var(--outline); border-radius: 10px; clip-path: none; }
    .pick-info small { font-family: 'Lilita One', sans-serif; color: #cfe6ff; font-size: 14px; }

    .burst { color: var(--gold); }
    #heroPanel { color: #fff; border: 4px solid var(--navy-edge); border-radius: 16px; background: linear-gradient(160deg, #34507f, #1f3156);
