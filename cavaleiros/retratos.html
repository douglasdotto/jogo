<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retratos dos Heróis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 12px; background: #2b2f45; font-family: 'Fredoka', sans-serif; color: #fff; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    figure { margin: 0; background: radial-gradient(#5a6390, #343a58); border-radius: 12px; text-align: center; padding-bottom: 4px; }
    img { display: block; width: 168px; height: 168px; }
    figcaption { font-size: 13px; font-weight: 700; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="grid"></div>
  <script type="module">
    // vitrine de dev: os heróis com a mesma luz e câmera dos retratos da tela de escolha (renderPortraits em main.js)
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { applyLook, buildCharacter, CHARACTERS } from './characters.js';
    import { LOOKS, LOOK_PREVIEW, WEAPONS, heroLook } from './looks.js';
    import { loadHeroAssets } from './hero-anims.js';

    const loader = new GLTFLoader();
    const assets = {};
    await loadHeroAssets(loader, assets, ['Knight', 'Barbarian', 'Mage', 'Rogue', 'Rogue_Hooded', 'Ranger', 'Knight20', 'Skeleton_Mage']);
    for (const n of ['Skeleton_Quiver', 'Skeleton_Staff']) assets[n] = await loader.loadAsync(`assets/${n}.gltf`);

    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    r.setSize(336, 336);
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xfff4dc, 0x553322, 2.2));
    const key = new THREE.DirectionalLight(0xffe2b8, 2.6);
    key.position.set(2, 4, 3);
    sc.add(key);
    const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    cam.position.set(1.72, 2.3, 5.15);   // afastada o bastante para chapéus altos e a auréola do nível 3
    cam.lookAt(0, 1.38, 0);
    // ?perto = close no rosto; ?so=id1,id2 = só esses heróis; ?costas = vista de trás
    const q = new URLSearchParams(location.search);
    if (q.has('perto')) { cam.position.set(0.5, 1.8, 2.3); cam.lookAt(0, 1.55, 0); }
    if (q.has('costas')) { cam.position.set(-1.6, 2.2, -3.8); cam.lookAt(0, 1.2, 0); }
    const only = q.get('so')?.split(',');

    const recipe = (id) => CHARACTERS.find((c) => c.id === id);
    // todas as variantes, na ordem da vitrine (8 por linha)
    const rows = [];
    for (let i = 0; i < LOOK_PREVIEW.length; i += 8) rows.push(LOOK_PREVIEW.slice(i, i + 8).map((v) => v.id));
    const grid = document.getElementById('grid');
    for (const ids of rows) {
      const row = document.createElement('div');
      row.className = 'row';
      grid.appendChild(row);
      for (const id of ids) {
        if (only && !only.includes(id)) continue;
        let model, animations, name;
        const preview = LOOK_PREVIEW.find((v) => v.id === id);
        if (!preview.recipe) {
          const hero = heroLook(id, preview.model, q.has('v10'));   // LOOKS20: herói no modelo 2.0 (?v10 mostra o 1.0)
          model = SkeletonUtils.clone(assets[hero.model].scene);
          model.traverse((o) => { if (WEAPONS[hero.model].includes(o.name) && !preview.use.includes(o.name)) o.visible = false; });
          applyLook(model, assets, hero.look);
          animations = assets[hero.model].animations;
          name = preview.name;
        } else {
          const rc = recipe(preview.recipe);
          ({ scene: model, animations } = buildCharacter(assets, rc));
          name = rc.name;
        }
        const idle = id === 'angel' ? 'Jump_Idle' : id === 'monk' ? 'Unarmed_Idle' : /Barbarian/.test(preview.model) || id === 'champion' || id === 'rei' ? '2H_Melee_Idle' : 'Idle';
        const mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(THREE.AnimationClip.findByName(animations, idle)).play();
        mixer.update(0.4);
        sc.add(model);
        r.render(sc, cam);
        const fig = document.createElement('figure');
        fig.innerHTML = `<img src="${r.domElement.toDataURL()}" alt=""><figcaption>${name}</figcaption>`;
        row.appendChild(fig);
        sc.remove(model);
      }
    }
    document.body.dataset.ready = '1';
    window.dev = { THREE, SkeletonUtils, assets, applyLook, LOOKS, r, sc, cam };   // para testar ajustes pelo console
  </script>
</body>
</html>
