<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Montanhas KayKit</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc6ff; font-family: sans-serif; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .tag { position: absolute; transform: translate(-50%, 0); padding: 2px 8px; font-size: 12px; color: #fff; background: #1f3156; border-radius: 8px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="labels"></div>
  <script type="module">
    // vitrine para ver o formato dos modelos de montanha/colina/pedra do KayKit Medieval Hexagon
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const names = ['mountain_A', 'mountain_A_grass', 'mountain_A_grass_trees', 'mountain_B', 'mountain_B_grass', 'mountain_B_grass_trees', 'mountain_C', 'mountain_C_grass', 'mountain_C_grass_trees', 'hills_A_trees', 'hills_B_trees', 'hills_C_trees', 'hill_single_A', 'hill_single_B', 'rock_single_A', 'rock_single_E'];
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7cc6ff);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 9, 13);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    scene.add(new THREE.HemisphereLight(0xfff4dc, 0x7a6a4a, 1.4));
    const sun = new THREE.DirectionalLight(0xffe2b8, 3);
    sun.position.set(5, 10, 6);
    sun.castShadow = true;
    scene.add(sun);
    const loader = new GLTFLoader();
    const tags = [];
    await Promise.all(names.map(async (n, i) => {
      const g = await loader.loadAsync(`assets/hex/${n}.gltf`);
      const col = i % 6, row = Math.floor(i / 6);
      g.scene.position.set((col - 2.5) * 2.4, 0, (row - 1) * 2.6);
      g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
      scene.add(g.scene);
      const t = document.createElement('div');
      t.className = 'tag';
      t.textContent = n;
      document.getElementById('labels').appendChild(t);
      tags.push([t, g.scene.position]);
    }));
    const v = new THREE.Vector3();
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      for (const [t, p] of tags) {
        v.copy(p).setY(-0.2).project(camera);
        t.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
        t.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
      }
    });
  </script>
</body>
</html>
